# Status thresholds — derived from the notes in the user's daily report:
#   "CPU dan Memory pada router/switch: normal jika < 80%"
#   "Internet traffic: normal jika < 300 Mbps"

router_switch:
  cpu_warning: 80
  cpu_critical: 90
  mem_warning: 80
  mem_critical: 90

wan_link:
  mbps_warning: 300
  mbps_critical: 800   # adjust to your actual provider circuit size

# Daily report window uses the laptop's local time. Traffic above the limit
# is marked as exceeded; a reading exactly at the limit is shown separately.
daily_report:
  start_time: "08:00"
  mbps_limit: 300
